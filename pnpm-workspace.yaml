packages:
  - .

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: true

# Patch known-vulnerable dev/build transitives to their fixed versions so the
# full-tree audit gate stays green. Scoped by range to keep each consumer on a
# compatible major (node-gyp -> undici 6.x, @electron/get -> undici 7.x,
# vitest/jsdom -> undici 8.x; brace-expansion lines stay on 1.x / 2.x / 5.x
# for minimatch consumers).
overrides:
  'undici@<6.28.1': ^6.28.1
  'undici@>=7.0.0 <7.29.1': ^7.29.1
  'undici@>=8.0.0 <8.10.2': ^8.10.2
  'form-data@>=4.0.0 <4.0.6': ^4.0.6
  'brace-expansion@<1.1.20': ^1.1.20
  'brace-expansion@>=2.0.0 <2.1.6': ^2.1.6
  'brace-expansion@>=3.0.0 <5.0.11': ^5.0.11
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'tar@<=7.5.18': ^7.5.19
  # Pin patched shell-quote; some build tools pin an exact vulnerable 1.8.x
  # and range overrides do not rewrite that edge.
  'shell-quote': 1.10.0
  'axios@>=1.15.2 <1.18.0': ^1.18.0
  'fast-uri@>=3.0.0 <3.1.7': ^3.1.7
  '@xmldom/xmldom@>=0.7.0 <0.8.15': ^0.8.15
  'nanoid@<3.3.17': ^3.3.17
